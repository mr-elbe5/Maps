<div class="dialog md">
    <div class="modalHeader">
        {*}
        <img class="closeIcon" src="/static-content/img/x-lg.svg" alt = "close" onclick="closeModalDialog();"/>
    </div>
    <div class="modalBody">
        <form action="/user/login" method="post" id="loginForm" name="loginForm" accept-charset="UTF-8">
            <div class="centered">
                <img src="/static-content/img/logo.png" alt="elbe5">
            </div>
            <div class="formGroup">
                <label for="user" class="sr-only">{*}
                </label>
                <input type="text" id="user" name="user" class="form-control"
                       required>
            </div>
            <div class="formGroup">
                <label for="password" class="sr-only">{*}
                </label>
                <input type="password" id="password" name="password" class="form-control"
                       required style="margin: 5px 0;">
            </div>
        </form>
    </div>
    <div class="modalFooter">
        <button class="primary" onclick="document.querySelector('#loginForm').submit();">{*}</button>
        <button onclick="closeModalDialog()">{*}</button>
    </div>
</div>
